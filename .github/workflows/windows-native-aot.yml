name: Build Windows x64 Native AOT

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore .\MiniGameBrowser.Rebuild.csproj

      - name: Publish Windows x64 Native AOT
        run: >-
          dotnet publish .\MiniGameBrowser.Rebuild.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishAot=true
          -p:StripSymbols=true
          -o .\publish

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path '.\publish\MiniGameBrowser.exe')) {
            throw 'Build completed without publish/MiniGameBrowser.exe'
          }
          Get-Item '.\publish\MiniGameBrowser.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniGameBrowser-Windows-x64
          path: publish/MiniGameBrowser.exe
          if-no-files-found: error
          retention-days: 14
